<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>手作库存管家</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --text:#18202a; --muted:#667085; --line:#e6e9ee;
  --primary:#111827; --primary-soft:#eef1f5; --green:#18864b; --green-soft:#e9f7ef;
  --orange:#b96900; --orange-soft:#fff4df; --red:#c93636; --red-soft:#ffeded;
  --shadow:0 10px 30px rgba(16,24,40,.07); --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
body{min-height:100vh}
.app{max-width:1440px;margin:0 auto;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:20;background:rgba(245,246,248,.92);backdrop-filter:blur(18px);padding:14px 0 10px}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;gap:11px;align-items:center}
.logo{width:44px;height:44px;border-radius:14px;background:var(--primary);display:grid;place-items:center;color:#fff;font-size:21px;box-shadow:var(--shadow)}
h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.02em}
.subtitle{font-size:12px;color:var(--muted);margin-top:2px}
.header-actions{display:flex;gap:8px;align-items:center}
.icon-btn,.secondary-btn,.primary-btn,.danger-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 13px;min-height:42px}
.primary-btn{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:700}
.danger-btn{color:var(--red);background:#fff;border-color:#f1cccc}
@media (hover:hover){button:hover{transform:translateY(-1px)}}
main{padding:10px 0 40px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px;box-shadow:var(--shadow)}
.stat .label{font-size:13px;color:var(--muted);margin-bottom:10px}
.stat .value{font-size:30px;font-weight:800;letter-spacing:-.03em}
.stat .hint{font-size:12px;color:var(--muted);margin-top:5px}
.toolbar{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 40px 0 13px;outline:none;background:#fafbfc}
.search span{position:absolute;right:12px;top:12px;color:#98a2b3}
select{height:44px;border:1px solid var(--line);border-radius:12px;background:#fafbfc;padding:0 12px;color:var(--text)}
.content-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;margin-top:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel-head{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel-title{font-size:16px;font-weight:800}
.muted{font-size:12px;color:var(--muted)}
.products{padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.product{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;display:flex;flex-direction:column;min-width:0}
.product-img{aspect-ratio:1/1;background:#f1f3f5;display:grid;place-items:center;overflow:hidden}
.product-img img{width:100%;height:100%;object-fit:cover}
.placeholder{font-size:34px;color:#a9b0bb}
.product-body{padding:12px}
.product-name{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product-sku{font-size:11px;color:var(--muted);margin-top:3px}
.stock-row{display:flex;justify-content:space-between;align-items:end;margin-top:10px}
.stock-num{font-size:26px;font-weight:850}
.stock-label{font-size:11px;color:var(--muted)}
.badge{font-size:11px;padding:5px 8px;border-radius:999px;white-space:nowrap;font-weight:700}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.orange{background:var(--orange-soft);color:var(--orange)}
.badge.red{background:var(--red-soft);color:var(--red)}
.product-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:0 12px 12px}
.product-actions button{min-height:40px;border-radius:11px;border:1px solid var(--line);background:#fafbfc;font-weight:700}
.product-actions .in{background:var(--green-soft);color:var(--green);border-color:#ccebd8}
.product-actions .out{background:var(--orange-soft);color:var(--orange);border-color:#f6dfb3}
.product-actions .more{grid-column:1/-1;background:#fff}
.side-list{padding:6px 14px 14px}
.tx{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.tx:last-child{border-bottom:0}
.tx-img{width:40px;height:40px;border-radius:11px;overflow:hidden;background:#f1f3f5;flex:none;display:grid;place-items:center}
.tx-img img{width:100%;height:100%;object-fit:cover}
.tx-mid{flex:1;min-width:0}
.tx-name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:11px;color:var(--muted);margin-top:3px}
.tx-qty{font-weight:850;font-size:15px}
.plus{color:var(--green)} .minus{color:var(--orange)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.mobile-nav{display:none}
.modal-wrap{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal-wrap.show{display:flex}
.modal{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.2)}
.modal h2{font-size:18px;margin:0 0 15px}
.modal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.close{border:0;background:#f2f4f7;width:38px;height:38px;border-radius:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin-top:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#fafbfc;padding:11px 12px;outline:none}
.field textarea{min-height:90px;resize:vertical}
.image-picker{border:1.5px dashed #c8ced7;background:#fafbfc;border-radius:15px;padding:12px;display:flex;gap:12px;align-items:center}
.preview{width:72px;height:72px;border-radius:12px;background:#eef1f4;display:grid;place-items:center;overflow:hidden;flex:none}
.preview img{width:100%;height:100%;object-fit:cover}
.image-picker input{display:none}
.pick-label{display:inline-flex;min-height:40px;padding:0 13px;align-items:center;border-radius:11px;background:#fff;border:1px solid var(--line);font-weight:700}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.confirm-number{font-size:48px;font-weight:900;text-align:center;padding:10px 0}
.stepper{display:flex;gap:8px;align-items:center}
.stepper button{width:46px;height:46px;border:1px solid var(--line);background:#f8fafc;border-radius:12px;font-size:20px}
.stepper input{text-align:center;font-size:20px;font-weight:800}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#111827;color:#fff;padding:11px 14px;border-radius:12px;z-index:200;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 10px 30px rgba(0,0,0,.22);font-size:13px}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1100px){.products{grid-template-columns:repeat(2,1fr)}.content-grid{grid-template-columns:1fr 310px}}
@media(max-width:800px){
  .app{padding-left:12px;padding-right:12px}
  header{padding-top:10px}
  .cards{grid-template-columns:repeat(2,1fr)}
  .content-grid{grid-template-columns:1fr}
  .side-panel{order:2}
  .products{grid-template-columns:repeat(2,1fr)}
  .mobile-nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:rgba(255,255,255,.94);backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));margin:10px -12px 0;z-index:25}
  .mobile-nav button{border:0;background:transparent;border-radius:12px;padding:8px 3px;color:#667085;font-size:11px}
  .mobile-nav b{display:block;font-size:19px;margin-bottom:3px}
  .header-actions .secondary-btn{display:none}
}
@media(min-width:801px){.modal-wrap{align-items:center}.modal{border-radius:24px;max-height:88vh;padding-bottom:20px}}
@media(max-width:520px){
  h1{font-size:18px}
  .logo{width:40px;height:40px}
  .cards{gap:8px}
  .stat{padding:13px;border-radius:15px}
  .stat .value{font-size:24px}
  .toolbar{padding:9px}
  .products{gap:8px;padding:9px}
  .product-body{padding:10px}
  .product-actions{padding:0 10px 10px}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="header-row">
    <div class="brand">
      <div class="logo">✦</div>
      <div><h1>手作库存管家</h1><div class="subtitle">商品、库存与进出记录，一页掌握</div></div>
    </div>
    <div class="header-actions">
      <button class="secondary-btn" id="exportBtn">备份数据</button>
      <button class="secondary-btn" id="importBtn">恢复数据</button>
      <button class="primary-btn" id="addBtn">＋ 新增商品</button>
      <input id="importFile" type="file" accept=".json" hidden>
    </div>
  </div>
</header>

<main>
  <section class="cards">
    <div class="stat"><div class="label">商品种类</div><div class="value" id="statProducts">0</div><div class="hint">已建立商品档案</div></div>
    <div class="stat"><div class="label">当前总库存</div><div class="value" id="statStock">0</div><div class="hint">所有商品库存数量</div></div>
    <div class="stat"><div class="label">低库存</div><div class="value" id="statLow">0</div><div class="hint">达到最低库存提醒</div></div>
    <div class="stat"><div class="label">今日进出</div><div class="value" id="statToday">0</div><div class="hint">今日变动件数</div></div>
  </section>

  <section class="toolbar">
    <div class="search"><input id="search" placeholder="搜索商品名称、编号…"><span>⌕</span></div>
    <select id="filter"><option value="all">全部库存状态</option><option value="ok">库存正常</option><option value="low">库存偏低</option><option value="out">已售罄</option></select>
    <button class="secondary-btn" id="sortBtn">按库存排序</button>
  </section>

  <section class="content-grid">
    <div class="panel">
      <div class="panel-head"><div class="panel-title">商品库存</div><div class="muted" id="resultCount">0 件商品</div></div>
      <div class="products" id="productGrid"></div>
    </div>

    <aside class="panel side-panel">
      <div class="panel-head"><div class="panel-title">最近库存变动</div><div class="muted">实时</div></div>
      <div class="side-list" id="txList"></div>
    </aside>
  </section>

  <div class="mobile-nav">
    <button id="navTop"><b>⌂</b>总览</button>
    <button id="navAdd"><b>＋</b>新增商品</button>
    <button id="navTx"><b>↕</b>进出库</button>
    <button id="navLow"><b>!</b>低库存</button>
  </div>
</main>
</div>

<div class="modal-wrap" id="productModal">
  <div class="modal">
    <div class="modal-top"><h2 id="productModalTitle">新增商品</h2><button class="close" data-close="productModal">×</button></div>
    <form id="productForm">
      <input type="hidden" id="productId">
      <div class="field">
        <label>商品图片</label>
        <div class="image-picker">
          <div class="preview" id="imagePreview">🧶</div>
          <div>
            <label class="pick-label" for="imageInput">上传商品图</label>
            <input id="imageInput" type="file" accept="image/*" capture="environment">
            <div class="muted" style="margin-top:6px">支持手机直接拍照；图片会自动压缩以节省空间</div>
          </div>
        </div>
      </div>
      <div class="grid2">
        <div class="field"><label>商品名称 *</label><input id="name" required placeholder="例如：奶油色编织花束"></div>
        <div class="field"><label>商品编号 / SKU</label><input id="sku" placeholder="例如：HB-001"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>初始库存</label><input id="initialStock" type="number" min="0" step="1" value="0"></div>
        <div class="field"><label>最低库存提醒</label><input id="minStock" type="number" min="0" step="1" value="3"></div>
      </div>
      <div class="field"><label>备注</label><textarea id="note" placeholder="材质、尺寸、颜色、摆放位置等"></textarea></div>
      <div class="modal-footer"><button type="button" class="secondary-btn" data-close="productModal">取消</button><button class="primary-btn" type="submit">保存商品</button></div>
    </form>
  </div>
</div>

<div class="modal-wrap" id="stockModal">
  <div class="modal">
    <div class="modal-top"><h2 id="stockTitle">库存变动</h2><button class="close" data-close="stockModal">×</button></div>
    <div class="muted" id="stockProductName"></div>
    <div class="stepper" style="margin-top:16px">
      <button id="minusOne">−</button>
      <input id="qtyInput" type="number" min="1" value="1">
      <button id="plusOne">＋</button>
    </div>
    <div class="field"><label>备注（可选）</label><input id="txNote" placeholder="例如：补货、售出、损耗、赠送"></div>
    <div class="modal-footer"><button type="button" class="secondary-btn" data-close="stockModal">取消</button><button class="primary-btn" id="confirmStock">确认</button></div>
  </div>
</div>

<div class="modal-wrap" id="detailModal">
  <div class="modal">
    <div class="modal-top"><h2>商品详情</h2><button class="close" data-close="detailModal">×</button></div>
    <div id="detailContent"></div>
    <div class="modal-footer">
      <button class="secondary-btn" id="editProductBtn">编辑</button>
      <button class="danger-btn" id="deleteProductBtn">删除商品</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DB_NAME='handmade-stock-db', STORE='app', KEY='state-v1';
let state={products:[],transactions:[]};
let activeProductId=null, activeTxType='in', editingProductId=null, sortAsc=false, pendingImage=null;

const $=id=>document.getElementById(id);
const fmtDate=d=>new Date(d).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
const todayKey=()=>{const d=new Date(); return d.toISOString().slice(0,10)};
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove('show'),1800)}

function openDB(){
  return new Promise((resolve,reject)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE)};
    r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
  });
}
async function dbSave(){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).put(state,KEY);
    tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
  });
}
async function dbLoad(){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readonly'); const r=tx.objectStore(STORE).get(KEY);
    r.onsuccess=()=>{if(r.result)state=r.result;resolve()}; r.onerror=()=>reject(r.error);
  });
}
function stock(p){return Number(p.stock||0)}
function status(p){const s=stock(p); if(s<=0)return 'out'; if(s<=Number(p.minStock||0))return 'low'; return 'ok'}
function statusText(s){return s==='out'?'售罄':s==='low'?'低库存':'库存正常'}
function badgeClass(s){return s==='out'?'red':s==='low'?'orange':'green'}
function productById(id){return state.products.find(p=>p.id===id)}
function render(){
  const q=$('search').value.trim().toLowerCase();
  const f=$('filter').value;
  let list=state.products.filter(p=>{
    const hit=!q || p.name.toLowerCase().includes(q) || (p.sku||'').toLowerCase().includes(q);
    const ok=f==='all'||status(p)===f;
    return hit&&ok;
  });
  list.sort((a,b)=>sortAsc?stock(a)-stock(b):stock(b)-stock(a));
  $('resultCount').textContent=list.length+' 件商品';
  $('statProducts').textContent=state.products.length;
  $('statStock').textContent=state.products.reduce((n,p)=>n+stock(p),0);
  $('statLow').textContent=state.products.filter(p=>status(p)!=='ok').length;
  $('statToday').textContent=state.transactions.filter(t=>t.date.slice(0,10)===todayKey()).reduce((n,t)=>n+Number(t.qty),0);
  $('productGrid').innerHTML=list.length?list.map(productCard).join(''):`<div class="empty" style="grid-column:1/-1">还没有商品。点击「＋ 新增商品」建立第一个库存档案。</div>`;
  renderTx();
}
function imgHtml(p){
  return p.image?`<img src="${p.image}" alt="">`:`<div class="placeholder">✦</div>`;
}
function productCard(p){
  const s=status(p);
  return `<article class="product">
    <div class="product-img">${imgHtml(p)}</div>
    <div class="product-body">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:start"><div style="min-width:0"><div class="product-name">${esc(p.name)}</div><div class="product-sku">${esc(p.sku||'未设置编号')}</div></div><span class="badge ${badgeClass(s)}">${statusText(s)}</span></div>
      <div class="stock-row"><div><div class="stock-num">${stock(p)}</div><div class="stock-label">目前库存</div></div><div class="muted">最低 ${Number(p.minStock||0)}</div></div>
    </div>
    <div class="product-actions">
      <button class="in" onclick="openStock('${p.id}','in')">＋ 入库</button>
      <button class="out" onclick="openStock('${p.id}','out')">− 出库</button>
      <button class="more" onclick="openDetail('${p.id}')">查看详情</button>
    </div>
  </article>`;
}
function renderTx(){
  const rows=state.transactions.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,10);
  $('txList').innerHTML=rows.length?rows.map(t=>{
    const p=productById(t.productId); if(!p)return '';
    return `<div class="tx"><div class="tx-img">${imgHtml(p)}</div><div class="tx-mid"><div class="tx-name">${esc(p.name)}</div><div class="tx-meta">${t.type==='in'?'入库':'出库'} · ${fmtDate(t.date)}${t.note?' · '+esc(t.note):''}</div></div><div class="tx-qty ${t.type==='in'?'plus':'minus'}">${t.type==='in'?'+':'−'}${t.qty}</div></div>`
  }).join(''):`<div class="empty">还没有进出库记录</div>`;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function show(id){$(id).classList.add('show')}
function hide(id){$(id).classList.remove('show')}

function resetProductForm(){
  $('productForm').reset(); $('productId').value=''; $('initialStock').value='0'; $('minStock').value='3';
  pendingImage=null; $('imagePreview').innerHTML='🧶'; $('productModalTitle').textContent='新增商品'; editingProductId=null;
}
function openAdd(){resetProductForm();show('productModal')}
function openEdit(id){
  const p=productById(id); if(!p)return;
  editingProductId=id; $('productModalTitle').textContent='编辑商品'; $('productId').value=id;
  $('name').value=p.name; $('sku').value=p.sku||''; $('initialStock').value=stock(p); $('minStock').value=Number(p.minStock||0); $('note').value=p.note||'';
  pendingImage=p.image||null; $('imagePreview').innerHTML=p.image?`<img src="${p.image}" alt="">`:'🧶'; show('productModal');
}
function openStock(id,type){
  const p=productById(id); if(!p)return;
  activeProductId=id;activeTxType=type;$('stockTitle').textContent=type==='in'?'入库':'出库';$('stockProductName').textContent=`${p.name} · 当前库存 ${stock(p)}`;$('qtyInput').value=1;$('txNote').value='';show('stockModal');
}
async function confirmStock(){
  const p=productById(activeProductId), qty=Math.max(1,Number($('qtyInput').value)||1);
  if(!p)return;
  if(activeTxType==='out' && stock(p)<qty){toast('库存不足，无法出库');return}
  p.stock=stock(p)+(activeTxType==='in'?qty:-qty);
  state.transactions.unshift({id:uid(),productId:p.id,type:activeTxType,qty,date:new Date().toISOString(),note:$('txNote').value.trim()});
  await dbSave(); hide('stockModal'); render(); toast(activeTxType==='in'?'入库成功':'出库成功');
}
async function saveProduct(e){
  e.preventDefault();
  const name=$('name').value.trim(); if(!name)return;
  const initial=Math.max(0,Number($('initialStock').value)||0), min=Math.max(0,Number($('minStock').value)||0);
  if(editingProductId){
    const p=productById(editingProductId); const old=stock(p); p.name=name;p.sku=$('sku').value.trim();p.minStock=min;p.note=$('note').value.trim();p.image=pendingImage;
    const delta=initial-old;
    if(delta!==0){p.stock=initial;state.transactions.unshift({id:uid(),productId:p.id,type:delta>0?'in':'out',qty:Math.abs(delta),date:new Date().toISOString(),note:'编辑商品时调整库存'})}
    else p.stock=initial;
    toast('商品资料已更新');
  }else{
    const p={id:uid(),name,sku:$('sku').value.trim(),stock:initial,minStock:min,note:$('note').value.trim(),image:pendingImage,createdAt:new Date().toISOString()};
    state.products.push(p);
    if(initial>0)state.transactions.unshift({id:uid(),productId:p.id,type:'in',qty:initial,date:new Date().toISOString(),note:'初始库存'});
    toast('商品已新增');
  }
  await dbSave();hide('productModal');render();
}
function openDetail(id){
  activeProductId=id; const p=productById(id);if(!p)return;
  $('detailContent').innerHTML=`
    <div style="display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start">
      <div class="product-img" style="border-radius:15px">${imgHtml(p)}</div>
      <div><div style="font-size:20px;font-weight:850">${esc(p.name)}</div><div class="muted" style="margin-top:4px">SKU：${esc(p.sku||'未设置')}</div>
      <div style="margin-top:18px;font-size:12px;color:#667085">目前库存</div><div style="font-size:42px;font-weight:900">${stock(p)}</div>
      <div class="badge ${badgeClass(status(p))}" style="display:inline-block;margin-top:6px">${statusText(status(p))} · 最低库存 ${Number(p.minStock||0)}</div></div>
    </div>
    ${p.note?`<div style="margin-top:18px;padding:12px;background:#f8fafc;border-radius:14px;font-size:13px;line-height:1.6"><b>备注</b><br>${esc(p.note)}</div>`:''}
  `;
  show('detailModal');
}
async function deleteActive(){
  const p=productById(activeProductId); if(!p)return;
  if(!confirm(`确定删除「${p.name}」吗？该商品的库存与进出库记录也会被移除。`))return;
  state.products=state.products.filter(x=>x.id!==p.id);state.transactions=state.transactions.filter(x=>x.productId!==p.id);
  await dbSave();hide('detailModal');render();toast('商品已删除');
}
async function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();reader.onload=()=>{
      const img=new Image();img.onload=()=>{
        const max=900;let w=img.width,h=img.height;if(Math.max(w,h)>max){if(w>h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}
        const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',.78))
      };img.onerror=reject;img.src=reader.result
    };reader.onerror=reject;reader.readAsDataURL(file);
  });
}
$('imageInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;pendingImage=await compressImage(f);$('imagePreview').innerHTML=`<img src="${pendingImage}" alt="">`;toast('商品图已准备好')});
$('productForm').addEventListener('submit',saveProduct);
$('confirmStock').addEventListener('click',confirmStock);
$('plusOne').onclick=()=>{$('qtyInput').value=Math.max(1,Number($('qtyInput').value||1)+1)}
$('minusOne').onclick=()=>{$('qtyInput').value=Math.max(1,Number($('qtyInput').value||1)-1)}
$('addBtn').onclick=openAdd;$('navAdd').onclick=openAdd;
$('editProductBtn').onclick=()=>{hide('detailModal');openEdit(activeProductId)};
$('deleteProductBtn').onclick=deleteActive;
$('search').oninput=render;$('filter').onchange=render;$('sortBtn').onclick=()=>{sortAsc=!sortAsc;render();toast(sortAsc?'按库存由少到多':'按库存由多到少')};
$('navLow').onclick=()=>{$('filter').value='low';render();window.scrollTo({top:0,behavior:'smooth'})};
$('navTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
$('navTx').onclick=()=>document.querySelector('.side-panel').scrollIntoView({behavior:'smooth'});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hide(b.dataset.close));
document.querySelectorAll('.modal-wrap').forEach(w=>w.addEventListener('click',e=>{if(e.target===w)w.classList.remove('show')}));

$('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(state)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='手作库存备份-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('备份文件已生成');
};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;try{
    const incoming=JSON.parse(await f.text());
    if(!Array.isArray(incoming.products)||!Array.isArray(incoming.transactions))throw Error('格式');
    if(confirm(`确认恢复备份？将覆盖当前数据，共 ${incoming.products.length} 个商品。`)){state=incoming;await dbSave();render();toast('数据已恢复')}
  }catch{toast('备份文件格式不正确')}
  e.target.value='';
};

(async()=>{
  try{await dbLoad()}catch{}
  if(!state.products.length && !state.transactions.length){
    state.products=[
      {id:uid(),name:'示范｜奶油色编织花束',sku:'DEMO-001',stock:12,minStock:3,note:'可直接删除示范商品',image:null,createdAt:new Date().toISOString()},
      {id:uid(),name:'示范｜手作耳饰',sku:'DEMO-002',stock:5,minStock:5,note:'达到最低库存会显示橙色提醒',image:null,createdAt:new Date().toISOString()},
      {id:uid(),name:'示范｜香氛石膏片',sku:'DEMO-003',stock:0,minStock:2,note:'库存为 0 会显示售罄',image:null,createdAt:new Date().toISOString()}
    ];
    await dbSave();
  }
  render();
})();
</script>
